services:
  redis:
    image: redis:7-alpine
    container_name: pixelflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: pixelflow-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
    volumes:
      - processed_images:/app/processed_images
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python worker.py
    environment:
      REDIS_HOST: redis
      VISIBILITY_TIMEOUT: "30"
      TEST_DELAY_SECONDS: "0"
    stop_grace_period: 30s
    volumes:
      - processed_images:/app/processed_images
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  processed_images: